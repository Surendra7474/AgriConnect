services:
  postgres:
    image: postgres:16-alpine
    container_name: agriconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-agriconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password}
      POSTGRES_DB: agriconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-agriconnect} -d agriconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agriconnect-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriconnect-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/agriconnect_db
      DB_USERNAME: ${DB_USERNAME:-agriconnect}
      DB_PASSWORD: ${DB_PASSWORD:-your_password}
      DB_DRIVER: org.postgresql.Driver
      JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-ChangeThisSecretToAStrongValueWithAtLeast32Characters}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-120}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-14}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@agriconnect.local}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-Admin@12345}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agriconnect-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: agriconnect-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agriconnect-network

volumes:
  postgres-data:

networks:
  agriconnect-network:
    driver: bridge
