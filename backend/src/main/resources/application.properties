spring.application.name=agriconnect
server.port=${PORT:8081}
spring.main.allow-bean-definition-overriding=true

# ---- H2 (default for local dev) ----
spring.datasource.url=${DB_URL:jdbc:h2:mem:agriconnect_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
# Override via env var for MySQL: org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jackson.default-property-inclusion=non_null

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

agriconnect.jwt.secret=${JWT_SECRET:ChangeThisSecretToAStrongValueWithAtLeast32Characters}
agriconnect.jwt.access-token-expiration-minutes=${JWT_ACCESS_MINUTES:120}
agriconnect.jwt.refresh-token-expiration-days=${JWT_REFRESH_DAYS:14}
agriconnect.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
agriconnect.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@agriconnect.local}
agriconnect.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@12345}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
