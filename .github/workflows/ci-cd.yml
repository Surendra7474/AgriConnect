name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agriconnect
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agriconnect_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/agriconnect_db_test
          DB_USERNAME: agriconnect
          DB_PASSWORD: test_password
          DB_DRIVER: org.postgresql.Driver
          JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
          JWT_SECRET: TestSecretKeyForCICDPipelineAtLeast32Characters
        run: mvn compile -B

      - name: Run Tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/agriconnect_db_test
          DB_USERNAME: agriconnect
          DB_PASSWORD: test_password
          DB_DRIVER: org.postgresql.Driver
          JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
          JWT_SECRET: TestSecretKeyForCICDPipelineAtLeast32Characters
        run: mvn test -B

      - name: Package
        working-directory: backend
        run: mvn package -DskipTests -B -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (if configured)
        working-directory: frontend
        run: npm run lint || echo "No lint script configured"
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # Vercel auto-deploys from GitHub natively - no action required
  # Render auto-deploys from GitHub natively - no action required
